# ===========================
# Test Profile Configuration
# ===========================
spring.application.name=webapp-test
server.port=0

# === JPA / Hibernate Test Configuration ===
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.hbm2ddl.auto=validate
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=64

# === Flyway Test Configuration ===
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# ===========================
# DB (Testcontainers MySQL)
# ===========================
# IMPORTANT: values overridden at runtime by DynamicPropertySource
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://DO-NOT-USE/should_be_overridden_by_testcontainers
db.username=placeholder
db.password=placeholder

# === Logging for Tests ===
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.dao=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.saymyname=DEBUG

# === JWT Test Configuration ===
app.jwt.secret-base64=dGVzdC1zZWNyZXQtZm9yLXVuaXQtdGVzdHMtb25seS1kb25vdC11c2UtaW4tcHJvZHVjdGlvbi1ldmVyLXRoaXMtaXMtanVzdC1mb3ItdGVzdGluZy1wdXJwb3Nlcw==
app.jwt.access-ttl-seconds=300

# === Refresh cookie ===
security.refresh-cookie.name=test_refresh_token
security.refresh-cookie.secure=false
security.refresh-cookie.same-site=Lax
security.refresh-cookie.path=/api/auth
security.refresh-cookie.max-age-seconds=3600

# === CSRF ===
security.xsrf-cookie.name=TEST-XSRF-TOKEN
security.xsrf-cookie.path=/
security.xsrf.header=X-XSRF-TOKEN

# === Mail Test Configuration ===
spring.mail.host=localhost
spring.mail.port=1025
app.mail.from=test@saymyname.test
app.mail.brand=Say My Name Test
app.mail.reset-subject=Test Password Reset
app.mail.changed-subject=Test Password Changed
app.mail.invite-subject=Test Invitation

# === CORS Test ===
security.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# === Frontend URL for Tests ===
app.frontend.base-url=http://localhost:3000
app.invite.route=/invitation

# === Photos Test Configuration ===
photos.storage.root=/tmp/saymyname-test/photos
photos.storage.public-base-url=http://localhost:8080/photos/
photos.storage.small-subdir=small
photos.storage.placeholder-small=placeholder/avatar-sm.webp
photos.ensure-small-via-endpoint=false
