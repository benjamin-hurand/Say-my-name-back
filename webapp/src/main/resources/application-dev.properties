# Active ce profil via: SPRING_PROFILES_ACTIVE=dev (ou -Dspring.profiles.active=dev)

# === Logs plus verbeux en dev ===
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.dao=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.saymyname=DEBUG

# === DB dev (si différente) — sinon hérite du commun ===
# db.url=jdbc:mysql://localhost:3306/saymyname_dev
# db.username=dev_user
# db.password=dev_pass

# === Mail DEV ===
# En dev on utilise ConsoleMailer (@Profile("dev")), donc PAS de spring.mail.* ici.
# On peut toutefois garder l'expéditeur/brand communs.
app.mail.from=no-reply@saymyname.app
app.mail.brand=Say My Name

# Base URL front locale
app.frontend.base-url=http://localhost:5173
