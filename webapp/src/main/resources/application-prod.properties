# Active ce profil via: SPRING_PROFILES_ACTIVE=prod (ou -Dspring.profiles.active=prod)

# === Logs prod (sobres) ===
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.dao=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.com.saymyname=INFO

# === DB prod (override si différente du commun) ===
# db.url=jdbc:mysql://<host>:3306/saymyname
# db.username=${DB_USERNAME}
# db.password=${DB_PASSWORD}

# === Mail PROD (SMTP réel) ===
spring.mail.host=smtp.office365.com
spring.mail.port=587
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# (optionnel, timeouts raisonnables)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App Mail (brand/sujets peuvent rester ceux du commun)
app.mail.from=no-reply@saymyname.app
app.mail.brand=Say My Name

# Base URL front prod (utilisée pour construire le lien de reset)
app.frontend.base-url=https://app.saymyname.app

security.refresh-cookie.secure=true
security.refresh-cookie.same-site=None