# === App ===
spring.application.name=webapp
server.port=8080
server.address=0.0.0.0

# ⚠️ IMPORTANT:
# Ne force pas "dev" ici. Utilise:
# - SPRING_PROFILES_ACTIVE=dev (local)
# - SPRING_PROFILES_ACTIVE=prod (prod)
# - @ActiveProfiles("test") en tests
# ou -Dspring.profiles.active=...
# spring.profiles.active=dev

# === JPA / Hibernate ===
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=64

# === Logs par défaut ===
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.dao=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.com.saymyname=DEBUG

# === DB (tes clés custom si tu as une config maison DataSource) ===
db.url=${DB_URL:jdbc:mysql://localhost:3306/saymyname}
db.username=${DB_USERNAME}
db.password=${DB_PASSWORD}
db.driver=com.mysql.cj.jdbc.Driver

# === Flyway ===
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

spring.flyway.url=${FLYWAY_URL:jdbc:mysql://localhost:3306/saymyname}
spring.flyway.user=${FLYWAY_USERNAME}
spring.flyway.password=${FLYWAY_PASSWORD}

# === Photos ===
photos.storage.root=${PHOTOS_STORAGE_ROOT:./webapp/data/photos}
photos.storage.public-base-url=http://localhost:8080/photos/
photos.storage.small-subdir=small
photos.storage.placeholder-small=placeholder/avatar-sm.webp
photos.ensure-small-via-endpoint=false
photos.api.small-endpoint-base=http://localhost:8080/photos/small/

# === JWT ===
app.jwt.secret-base64=${APP_JWT_SECRET_BASE64}
app.jwt.access-ttl-seconds=900

# === Refresh cookie (HttpOnly) ===
security.refresh-cookie.name=refresh_token
security.refresh-cookie.secure=false
security.refresh-cookie.same-site=Lax
security.refresh-cookie.path=/api/auth
security.refresh-cookie.max-age-seconds=2592000

# === CSRF Double Submit ===
security.xsrf-cookie.name=XSRF-TOKEN
security.xsrf-cookie.path=/
security.xsrf.header=X-XSRF-TOKEN

# === Mail (propriétés "app") ===
app.mail.from=no-reply@saymyname.app
app.mail.brand=Say My Name
app.mail.reset-subject=Réinitialisation de votre mot de passe
app.mail.changed-subject=Votre mot de passe a été modifié
app.mail.invite-subject=Invitation à rejoindre ${app.mail.brand}

# CORS
security.cors.allowed-origins=http://localhost:5173,https://app.saymyname.app

# Invitation - URL publique du front
app.frontend.base-url=https://app.saymyname.app
# Invitation - path de la page d’acceptation
app.invite.route=/invitation
